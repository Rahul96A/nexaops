name: Deploy

# Promotion pipeline.
#
# main deploys to dev automatically. Staging and production are manual only: their resource
# groups are not provisioned and the pipeline's identity has no permission outside dev, so an
# automatic run would fail every time and, if the permissions were widened, would silently
# provision very expensive infrastructure. Promotion is therefore an explicit act -- run the
# workflow by hand and choose the environment.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, test, stg, prod]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  AZURE_RESOURCE_GROUP_PREFIX: rg-nexaops

# Federated credentials rather than a stored service principal secret: the workflow exchanges a
# short-lived GitHub OIDC token for an Azure token, so there is no long-lived credential in
# repository secrets to leak or rotate.
permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      imageTag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: echo "tag=1.0.${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/NexaOps.Web/package-lock.json

      - name: Build front end
        working-directory: src/NexaOps.Web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build

      - name: Upload front end
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ steps.version.outputs.tag }}
          path: src/NexaOps.Web/dist

      # The EF tooling reads project.assets.json to work out what to build, and that file only
      # exists after a restore. Without this step the bundle failed with NETSDK1004 on every
      # run — a deploy path that had never once completed, while CI stayed green throughout
      # because CI restores as part of its own build.
      - name: Restore
        run: dotnet restore NexaOps.slnx

      # The migration bundle is a self-contained executable that applies the schema. Producing
      # it here means the deployment step needs neither the SDK nor the source, and the exact
      # schema change can be reviewed as an artefact before it touches a database.
      - name: Create migration bundle
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          export PATH="$PATH:$HOME/.dotnet/tools"

          # --output names the executable, not a directory. Written as ./migrate it produced a
          # file called "migrate", while the deploy job looked for ./migrate-artifact/efbundle --
          # so the artifact uploaded and downloaded perfectly and the next step failed on a name
          # that had never existed.
          mkdir -p ./migrate

          dotnet ef migrations bundle \
            --project src/NexaOps.Infrastructure/NexaOps.Infrastructure.csproj \
            --startup-project src/NexaOps.Infrastructure/NexaOps.Infrastructure.csproj \
            --configuration Release \
            --self-contained --target-runtime linux-x64 \
            --output ./migrate/efbundle --force

      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: migration-bundle-${{ steps.version.outputs.tag }}
          path: ./migrate

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the container registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # Required by the cache-to below. The runner's default builder uses the "docker" driver,
      # which cannot export a cache, so the build failed outright with "Cache export is not
      # supported for the docker driver" -- the layer cache was not merely inactive, it stopped
      # the image being built at all.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/NexaOps.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/nexaops-api:${{ steps.version.outputs.tag }}
            ${{ secrets.ACR_NAME }}.azurecr.io/nexaops-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}

  # ---------------------------------------------------------------------------
  dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build]
    if: github.ref == 'refs/heads/main' || inputs.environment == 'dev'
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.publicUrl }}

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A what-if is printed before anything is applied, so the deployment log shows exactly
      # what changed - which is the difference between an audited change and a surprise.
      - name: Preview infrastructure changes
        run: |
          az deployment group what-if \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-dev \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/dev.bicepparam \
            --parameters sqlAdminGroupObjectId=${{ secrets.SQL_ADMIN_GROUP_OBJECT_ID }}

      # The image currently running, so the infrastructure deployment leaves it alone.
      #
      # Without this the template resets the container app to its bootstrap placeholder, and the
      # site serves Microsoft's sample page for the minute between this step and the release
      # step below. Empty on a first deployment, which is exactly when the placeholder is the
      # right answer.
      - name: Read the running image
        id: current
        run: |
          image=$(az containerapp show \
            --name ca-nexaops-dev-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-dev \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)

          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Deploy infrastructure
        id: deploy
        run: |
          outputs=$(az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-dev \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/dev.bicepparam \
            --parameters sqlAdminGroupObjectId=${{ secrets.SQL_ADMIN_GROUP_OBJECT_ID }} \
            --parameters containerImage='${{ steps.current.outputs.image }}' \
            --query properties.outputs -o json)

          echo "publicUrl=$(echo "$outputs" | jq -r .publicUrl.value)" >> "$GITHUB_OUTPUT"
          echo "containerAppName=$(echo "$outputs" | jq -r .containerAppName.value)" >> "$GITHUB_OUTPUT"
          echo "sqlServerFqdn=$(echo "$outputs" | jq -r .sqlServerFqdn.value)" >> "$GITHUB_OUTPUT"
          echo "sqlDatabaseName=$(echo "$outputs" | jq -r .sqlDatabaseName.value)" >> "$GITHUB_OUTPUT"

      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: migration-bundle-${{ needs.build.outputs.imageTag }}
          path: ./migrate-artifact

      # A GitHub runner is not an Azure service, so the "allow Azure services" rule does not
      # cover it and its address is refused by the SQL firewall. The runner opens a rule for its
      # own address only, for the length of this job, and closes it again below -- including
      # when the migration fails, which is the case that matters.
      - name: Open the SQL firewall for this runner
        id: firewall
        run: |
          runner_ip=$(curl -s --max-time 30 https://api.ipify.org)
          echo "rule=gh-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

          az sql server firewall-rule create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-dev \
            --server "$(echo '${{ steps.deploy.outputs.sqlServerFqdn }}' | cut -d. -f1)" \
            --name "gh-${{ github.run_id }}" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none

      # Migrations are applied as an explicit, reviewable step before the new image is released.
      # A replica restarting must never change the schema on its own.
      - name: Apply database migrations
        run: |
          chmod +x ./migrate-artifact/efbundle
          ./migrate-artifact/efbundle \
            --connection "Server=tcp:${{ steps.deploy.outputs.sqlServerFqdn }},1433;Database=${{ steps.deploy.outputs.sqlDatabaseName }};Authentication=Active Directory Default;Encrypt=True;"

      - name: Close the SQL firewall
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-dev \
            --server "$(echo '${{ steps.deploy.outputs.sqlServerFqdn }}' | cut -d. -f1)" \
            --name "${{ steps.firewall.outputs.rule }}" \
            --output none

      - name: Release the new image
        run: |
          az containerapp update \
            --name ${{ steps.deploy.outputs.containerAppName }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-dev \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/nexaops-api:${{ needs.build.outputs.imageTag }}

      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.publicUrl }}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "$url/health/ready" > /dev/null; then
              echo "Readiness probe passed after $attempt attempt(s)."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "::error::The deployed revision never became ready."
              exit 1
            fi

            sleep 10
          done

          # An unauthenticated request must be refused. If this ever returns 200, the fallback
          # authorization policy has regressed and the whole API is public.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$url/api/v1/incidents")
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from an unauthenticated request, got $status."
            exit 1
          fi

          echo "Smoke tests passed."

  # ---------------------------------------------------------------------------
  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]

    # Manual only. Never triggered by a push: rg-nexaops-prod does not exist and the pipeline's
    # identity has no permission to create it, so an automatic attempt would fail on every
    # commit. Approving this once provisions Business Critical SQL, Premium Redis, Front Door
    # and API Management, which is a deliberate decision rather than a side effect of merging.
    if: inputs.environment == 'prod'

    # Protected environment with required reviewers. This is the manual gate: the job waits
    # here until a human approves it, and nothing reaches customers before that.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.publicUrl }}

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Preview infrastructure changes
        run: |
          az deployment group what-if \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-prod \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/prod.bicepparam \
            --parameters sqlAdminGroupObjectId=${{ secrets.SQL_ADMIN_GROUP_OBJECT_ID }}

      - name: Deploy infrastructure
        id: deploy
        run: |
          outputs=$(az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-prod \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/prod.bicepparam \
            --parameters sqlAdminGroupObjectId=${{ secrets.SQL_ADMIN_GROUP_OBJECT_ID }} \
            --query properties.outputs -o json)

          echo "publicUrl=$(echo "$outputs" | jq -r .publicUrl.value)" >> "$GITHUB_OUTPUT"
          echo "containerAppName=$(echo "$outputs" | jq -r .containerAppName.value)" >> "$GITHUB_OUTPUT"
          echo "sqlServerFqdn=$(echo "$outputs" | jq -r .sqlServerFqdn.value)" >> "$GITHUB_OUTPUT"
          echo "sqlDatabaseName=$(echo "$outputs" | jq -r .sqlDatabaseName.value)" >> "$GITHUB_OUTPUT"

      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: migration-bundle-${{ needs.build.outputs.imageTag }}
          path: ./migrate-artifact

      - name: Apply database migrations
        run: |
          chmod +x ./migrate-artifact/efbundle
          ./migrate-artifact/efbundle \
            --connection "Server=tcp:${{ steps.deploy.outputs.sqlServerFqdn }},1433;Database=${{ steps.deploy.outputs.sqlDatabaseName }};Authentication=Active Directory Default;Encrypt=True;"

      - name: Release the new image
        run: |
          az containerapp update \
            --name ${{ steps.deploy.outputs.containerAppName }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-prod \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/nexaops-api:${{ needs.build.outputs.imageTag }}

      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.publicUrl }}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "$url/health/ready" > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "::error::The deployed revision never became ready."
              exit 1
            fi

            sleep 10
          done

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$url/api/v1/incidents")
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from an unauthenticated request, got $status."
            exit 1
          fi

      # Container Apps keeps the previous revision, so a failed smoke test shifts all traffic
      # back to it in seconds rather than waiting for a rebuild.
      - name: Roll back on failure
        if: failure()
        run: |
          previous=$(az containerapp revision list \
            --name ${{ steps.deploy.outputs.containerAppName }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-prod \
            --query "[?properties.active && properties.trafficWeight==\`0\`] | [0].name" -o tsv)

          if [ -n "$previous" ]; then
            echo "::warning::Rolling back to revision $previous."
            az containerapp ingress traffic set \
              --name ${{ steps.deploy.outputs.containerAppName }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP_PREFIX }}-prod \
              --revision-weight "$previous=100"
          fi
